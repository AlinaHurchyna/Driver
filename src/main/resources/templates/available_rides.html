<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доступные поездки — Driver</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    .ride-card-uber { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 12px; transition: border-color 0.2s; }
    .ride-card-uber:hover { border-color: #06c167; }
    .ride-address { font-size: 14px; color: var(--text-primary); font-weight: 500; }
    .ride-address-label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
    .ride-divider { border: none; border-top: 1px dashed var(--border); margin: 12px 0; }
    .ride-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .btn-maps { display: flex; align-items: center; gap: 7px; background: #1a2744; border: 1.5px solid #3b82f6; color: #60a5fa; border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; transition: background 0.2s; }
    .btn-maps:hover { background: #1e3a8a; }
    #rideMap { height: 260px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/home" class="navbar-brand" style="color:var(--driver-accent)">DRIVER</a>
  <div class="navbar-links">
    <div class="lang-switcher">
      <a th:href="@{/api/drivers/available-rides(lang=ru)}" class="lang-btn" th:classappend="${#locale.language == 'ru'} ? 'active'">RU</a>
      <a th:href="@{/api/drivers/available-rides(lang=en)}" class="lang-btn" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
      <a th:href="@{/api/drivers/available-rides(lang=pl)}" class="lang-btn" th:classappend="${#locale.language == 'pl'} ? 'active'">PL</a>
      <a th:href="@{/api/drivers/available-rides(lang=be)}" class="lang-btn" th:classappend="${#locale.language == 'be'} ? 'active'">BY</a>
    </div>
    <a href="/api/drivers/dashboard" th:text="#{nav.back}">← Назад</a>
    <form th:action="@{/logout}" method="post" style="display:inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="btn btn-secondary btn-sm" th:text="#{nav.logout}">Выйти</button></form>
  </div>
</nav>

<div class="dashboard">
  <div class="dashboard-header fade-up fade-up-1">
    <h1>🗺️ <span th:text="#{rides.title}">Доступные поездки</span></h1>
    <p style="color:var(--text-secondary); margin-top:8px; font-size:16px;" th:text="#{rides.subtitle}">Выберите и примите поездку</p>
  </div>

  <!-- Map -->
  <div class="card fade-up fade-up-2" style="margin-bottom:16px;">
    <div style="font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;">📡 <span th:text="#{rides.map}">Карта поездок</span></div>
    <div id="rideMap" th:attr="data-you=#{map.you}"></div>
  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(rides)}" class="card fade-up fade-up-3" style="text-align:center; padding:56px 24px;">
    <div style="font-size:3.5rem; margin-bottom:16px;">🚗</div>
    <h3 style="margin-bottom:10px;" th:text="#{rides.empty.title}">Пока нет доступных поездок</h3>
    <p style="color:var(--text-secondary); margin-bottom:24px;" th:text="#{rides.empty.subtitle}">Обновите страницу чуть позже</p>
    <button onclick="location.reload()" class="btn btn-driver">🔄 <span th:text="#{rides.reload}">Обновить</span></button>
  </div>

  <!-- Rides list -->
  <div th:each="ride, stat : ${rides}" class="ride-card-uber fade-up"
       th:style="'animation-delay:' + ${stat.index * 0.07} + 's;'">

    <!-- Route -->
    <div style="display:flex; gap:12px; align-items:stretch;">
      <div style="display:flex; flex-direction:column; align-items:center; padding-top:4px;">
        <div style="width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #666;flex-shrink:0;"></div>
        <div style="width:2px;flex:1;background:var(--border);margin:4px 0;"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#06c167;flex-shrink:0;"></div>
      </div>
      <div style="flex:1;">
        <div class="ride-address-label" th:text="#{rides.from}">Откуда</div>
        <div class="ride-address" th:text="${ride.startLocation}">Адрес отправления</div>
        <hr class="ride-divider"/>
        <div class="ride-address-label" th:text="#{rides.to}">Куда</div>
        <div class="ride-address" th:text="${ride.destination}">Адрес назначения</div>
      </div>
      <div>
        <span style="background:#1c2a1c;color:#06c167;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;" th:text="#{rides.status}">Ожидает</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="ride-actions">
      <!-- Google Maps навигация к клиенту -->
      <a th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${#strings.replace(ride.startLocation, ' ', '+')}"
         target="_blank" class="btn-maps">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="3 11 22 2 13 21 11 13 3 11"/>
        </svg>
        <span th:text="#{rides.navigate}">Навигация к клиенту</span>
      </a>

      <!-- Принять поездку -->
      <form th:action="@{/api/drivers/accept-ride}" method="post" style="margin:0;">
        <input type="hidden" name="rideId" th:value="${ride.id}"/>
        <button type="submit" class="btn btn-success" th:text="#{rides.accept}">Принять</button>
      </form>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const map = L.map('rideMap').setView([52.2297, 21.0122], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

// Show driver's own location
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    const driverIcon = L.divIcon({ className: '', iconSize:[14,14], iconAnchor:[7,7],
      html:'<div style="width:14px;height:14px;background:#ff6b00;border-radius:50%;border:3px solid #fff;"></div>'
    });
    L.marker([lat, lon], { icon: driverIcon }).addTo(map).bindPopup('🚘 ' + document.getElementById('rideMap').dataset.you).openPopup();
    map.setView([lat, lon], 14);
  }, null, { enableHighAccuracy: true });
}

// Geocode ride addresses and put markers
const rides = /*[[${rides}]]*/ [];
</script>
</body>
</html>
