<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет клиента — Driver</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #map { height: 340px; border-radius: 12px; margin-top: 16px; border: 1px solid var(--border); }
    .map-card { margin-bottom: 16px; }
    .input-with-icon { position: relative; }
    .input-with-icon .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
    .input-with-icon .form-input { padding-left: 40px; }
    /* Pulsing GPS dot */
    .gps-dot { width: 16px; height: 16px; position: relative; }
    .gps-dot-inner { width: 16px; height: 16px; background: #2563eb; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #2563eb; position: absolute; }
    .gps-dot-pulse { width: 40px; height: 40px; background: rgba(37,99,235,0.25); border-radius: 50%; position: absolute; top: -12px; left: -12px; animation: gpsPulse 2s ease-out infinite; }
    @keyframes gpsPulse { 0%{transform:scale(0.6);opacity:1} 100%{transform:scale(2);opacity:0} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    /* GPS locate button on map */
    .gps-btn { position: absolute; bottom: 12px; right: 12px; z-index: 1000; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 18px; transition: background 0.2s; }
    .gps-btn:hover { background: var(--bg-input); }
    #gps-status { font-size: 12px; color: var(--text-secondary); margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/home" class="navbar-brand">DRIVER</a>
  <div class="navbar-links">
    <div class="lang-switcher">
      <a th:href="@{/client/dashboard(lang=ru)}" class="lang-btn" th:classappend="${#locale.language == 'ru'} ? 'active'">RU</a>
      <a th:href="@{/client/dashboard(lang=en)}" class="lang-btn" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
      <a th:href="@{/client/dashboard(lang=pl)}" class="lang-btn" th:classappend="${#locale.language == 'pl'} ? 'active'">PL</a>
      <a th:href="@{/client/dashboard(lang=be)}" class="lang-btn" th:classappend="${#locale.language == 'be'} ? 'active'">BY</a>
    </div>
    <span style="color:var(--text-secondary); font-size:14px;" th:if="${client != null}">
      👤 <span th:text="${client.firstName + ' ' + client.lastName}"></span>
    </span>
    <a href="/client/ride-history" th:text="#{nav.history}">История</a>
    <form th:action="@{/logout}" method="post" style="display:inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="btn btn-secondary btn-sm" th:text="#{nav.logout}">Выйти</button></form>
  </div>
</nav>

<div class="dashboard">
  <div class="dashboard-header fade-up fade-up-1">
    <h1>
      <span th:text="#{dashboard.client.greeting}">Привет,</span>
      <span th:if="${client != null}" th:text="${client.firstName}">Клиент</span> 👋
    </h1>
    <p style="color:var(--text-secondary); margin-top:8px; font-size:16px;" th:text="#{dashboard.client.subtitle}">Куда едем?</p>
  </div>

  <div th:if="${success}" class="alert alert-success fade-up" th:text="${success}"></div>

  <!-- Ride status notification (shown when driver accepts) -->
  <div id="rideStatusBanner" style="display:none; background:#0d1f3c; border:1.5px solid #3b82f6; border-radius:14px; padding:16px 20px; margin-bottom:16px; animation:fadeIn 0.4s ease;"
    th:attr="data-pending-title=#{banner.pending.title},data-pending-text=#{banner.pending.text},data-accepted-title=#{banner.accepted.title},data-accepted-text=#{banner.accepted.text},data-inprogress-title=#{banner.inprogress.title},data-inprogress-text=#{banner.inprogress.text},data-completed-title=#{banner.completed.title},data-completed-text=#{banner.completed.text},data-map-from=#{map.from},data-map-to=#{map.to}">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="font-size:2rem;" id="rideStatusIcon">🚗</div>
      <div style="flex:1;">
        <div style="font-size:15px; font-weight:700; color:#60a5fa;" id="rideStatusTitle"></div>
        <div style="font-size:13px; color:var(--text-secondary); margin-top:4px;" id="rideStatusText"></div>
      </div>
      <div style="width:10px; height:10px; border-radius:50%; background:#3b82f6; animation:gpsPulse 1.5s ease-out infinite;"></div>
    </div>
  </div>

  <!-- Book ride form -->
  <div class="card fade-up fade-up-2" style="margin-bottom:16px;">
    <h3 style="margin-bottom:20px;" th:text="#{dashboard.ride.title}">🗺️ Заказать поездку</h3>
    <form id="rideForm" th:action="@{/client/request-ride}" method="post">
      <div class="form-group">
        <label class="form-label" th:text="#{dashboard.ride.from}">Откуда</label>
        <button type="button" id="gpsFromBtn"
          style="display:flex;align-items:center;gap:8px;background:#1a1f2e;border:1.5px solid #2563eb;color:#60a5fa;border-radius:10px;padding:10px 14px;width:100%;margin-bottom:8px;cursor:pointer;font-size:14px;font-weight:600;transition:background 0.2s;"
          th:attr="data-label=#{gps.btn},data-locating=#{gps.locating},data-unavailable=#{gps.unavailable},data-denied=#{gps.denied},data-active=#{gps.active},data-here=#{gps.here},data-from=#{gps.from}">
          <span style="font-size:18px;" id="gpsFromIcon">📍</span>
          <span id="gpsFromText" th:text="#{gps.btn}">Использовать моё местоположение</span>
        </button>
        <div class="input-with-icon">
          <span class="icon">🔍</span>
          <input class="form-input" type="text" id="startLocation" name="startLocation"
                 th:placeholder="#{dashboard.ride.from.placeholder}" autocomplete="off" required/>
        </div>
        <div id="fromSuggestions" class="suggestions"></div>
      </div>
      <div class="form-group">
        <label class="form-label" th:text="#{dashboard.ride.to}">Куда</label>
        <div class="input-with-icon">
          <span class="icon">🏁</span>
          <input class="form-input" type="text" id="destination" name="destination"
                 th:placeholder="#{dashboard.ride.to.placeholder}" required autocomplete="off"/>
        </div>
        <div id="toSuggestions" class="suggestions"></div>
      </div>
      <button type="submit" class="btn btn-success btn-lg"
              th:text="#{dashboard.ride.btn}" th:attr="data-loading=#{dashboard.ride.btn.loading}">
        Найти водителя
      </button>
    </form>

    <!-- Map -->
    <div style="position:relative;">
      <div id="map"></div>
      <button class="gps-btn" id="locateBtn" title="Моё местоположение">📍</button>
    </div>
    <div id="gps-status"></div>
  </div>

  <!-- Stats -->
  <div class="dashboard-grid fade-up fade-up-3">
    <div class="stat-card">
      <div class="stat-icon stat-icon-green">🚗</div>
      <div>
        <div class="stat-label" th:text="#{dashboard.status}">Статус</div>
        <div class="stat-value" style="color:var(--success); font-size:1rem;" th:text="#{dashboard.status.ready}">Готов к поездке</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon stat-icon-white">📋</div>
      <div>
        <div class="stat-label" th:text="#{dashboard.history}">История</div>
        <a href="/client/ride-history" class="btn btn-secondary btn-sm" style="margin-top:6px;" th:text="#{dashboard.history.btn}">Смотреть</a>
      </div>
    </div>
  </div>
</div>

<style>
.suggestions {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 8px 8px;
  max-height: 180px;
  overflow-y: auto;
  display: none;
  position: absolute;
  width: 100%;
  z-index: 1000;
}
.suggestions .suggestion-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.suggestions .suggestion-item:hover { background: var(--bg-input); color: var(--text-primary); }
.input-with-icon { position: relative; }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
// Init map
const map = L.map('map').setView([52.2297, 21.0122], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let fromMarker = null, toMarker = null, routeLine = null, myMarker = null, myAccCircle = null;

const fromIcon = L.divIcon({ className: '', html: '<div style="background:#fff;width:14px;height:14px;border-radius:50%;border:3px solid #000;"></div>' });
const toIcon   = L.divIcon({ className: '', html: '<div style="background:#06c167;width:14px;height:14px;border-radius:50%;border:3px solid #000;"></div>' });
const myIcon   = L.divIcon({ className: '', iconSize: [16,16], iconAnchor: [8,8],
  html: '<div class="gps-dot"><div class="gps-dot-pulse"></div><div class="gps-dot-inner"></div></div>'
});

const statusEl = document.getElementById('gps-status');
const gpsBtn = document.getElementById('gpsFromBtn');
const T = {
  btn:         gpsBtn.dataset.label,
  locating:    gpsBtn.dataset.locating,
  unavailable: gpsBtn.dataset.unavailable,
  denied:      gpsBtn.dataset.denied,
  active:      gpsBtn.dataset.active,
  here:        gpsBtn.dataset.here,
  from:        gpsBtn.dataset.from
};

function setMyPosition(lat, lon, acc) {
  if (myMarker) { map.removeLayer(myMarker); map.removeLayer(myAccCircle); }
  myAccCircle = L.circle([lat, lon], { radius: acc, color: '#2563eb', fillColor: '#2563eb', fillOpacity: 0.08, weight: 1 }).addTo(map);
  myMarker = L.marker([lat, lon], { icon: myIcon }).addTo(map).bindPopup('📍 ' + T.here);
  statusEl.textContent = '📡 ' + T.active.replace('{0}', Math.round(acc));
}

function locateMe(panMap) {
  if (!navigator.geolocation) { statusEl.textContent = T.unavailable; return; }
  statusEl.textContent = '📡 ' + T.locating;
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
    setMyPosition(lat, lon, acc);
    if (panMap) map.setView([lat, lon], 15);
    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
      .then(r => r.json())
      .then(data => {
        const addr = data.display_name || (lat.toFixed(5) + ', ' + lon.toFixed(5));
        const input = document.getElementById('startLocation');
        if (!input.value) {
          input.value = addr;
          if (fromMarker) map.removeLayer(fromMarker);
          fromMarker = L.marker([lat, lon], { icon: fromIcon }).addTo(map).bindPopup(T.from + ' ' + addr);
          drawRoute();
        }
      }).catch(() => {});
  }, () => {
    statusEl.textContent = '⚠️ ' + T.denied;
  }, { enableHighAccuracy: true, timeout: 10000 });
}

locateMe(true);

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(pos => {
    setMyPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
  }, null, { enableHighAccuracy: true });
}

document.getElementById('locateBtn').addEventListener('click', () => locateMe(true));

gpsBtn.addEventListener('click', () => {
  if (!navigator.geolocation) return;
  const icon  = document.getElementById('gpsFromIcon');
  const label = document.getElementById('gpsFromText');

  icon.textContent = '⏳';
  label.textContent = T.locating;
  gpsBtn.style.opacity = '0.7';
  gpsBtn.disabled = true;
  statusEl.textContent = '📡 ' + T.locating;

  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
    setMyPosition(lat, lon, acc);
    map.setView([lat, lon], 17);

    fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`)
      .then(r => r.json())
      .then(data => {
        const addr = data.display_name || (lat.toFixed(6) + ', ' + lon.toFixed(6));
        document.getElementById('startLocation').value = addr;
        statusEl.textContent = '✅ ' + T.active.replace('{0}', Math.round(acc));
        icon.textContent = '✅';
        label.textContent = addr.length > 50 ? addr.substring(0, 50) + '…' : addr;
        gpsBtn.style.borderColor = '#06c167';
        gpsBtn.style.color = '#06c167';
        gpsBtn.style.opacity = '1';
        gpsBtn.disabled = false;
        if (fromMarker) map.removeLayer(fromMarker);
        fromMarker = L.marker([lat, lon], { icon: fromIcon }).addTo(map).bindPopup(T.from + ' ' + addr).openPopup();
        drawRoute();
      }).catch(() => {
        const addr = lat.toFixed(5) + ', ' + lon.toFixed(5);
        document.getElementById('startLocation').value = addr;
        icon.textContent = '✅';
        label.textContent = addr;
        gpsBtn.style.opacity = '1';
        gpsBtn.disabled = false;
      });
  }, () => {
    icon.textContent = '⚠️';
    label.textContent = T.denied;
    gpsBtn.style.borderColor = '#ef4444';
    gpsBtn.style.color = '#ef4444';
    gpsBtn.style.opacity = '1';
    gpsBtn.disabled = false;
    setTimeout(() => {
      icon.textContent = '📍';
      label.textContent = T.btn;
      gpsBtn.style.borderColor = '#2563eb';
      gpsBtn.style.color = '#60a5fa';
    }, 4000);
  }, { enableHighAccuracy: true, timeout: 10000 });
});

// Address autocomplete using Nominatim (free, no API key)
function setupAutocomplete(inputId, suggestionsId, onSelect) {
  const input = document.getElementById(inputId);
  const box = document.getElementById(suggestionsId);
  let timer;

  input.addEventListener('input', function () {
    clearTimeout(timer);
    const q = this.value.trim();
    if (q.length < 3) { box.style.display = 'none'; return; }
    timer = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&addressdetails=1`)
        .then(r => r.json())
        .then(data => {
          box.innerHTML = '';
          if (!data.length) { box.style.display = 'none'; return; }
          data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.textContent = item.display_name;
            div.addEventListener('click', () => {
              input.value = item.display_name;
              box.style.display = 'none';
              onSelect(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
            });
            box.appendChild(div);
          });
          box.style.display = 'block';
        });
    }, 400);
  });

  document.addEventListener('click', e => {
    if (!input.contains(e.target)) box.style.display = 'none';
  });
}

setupAutocomplete('startLocation', 'fromSuggestions', (lat, lon, name) => {
  if (fromMarker) map.removeLayer(fromMarker);
  fromMarker = L.marker([lat, lon], { icon: fromIcon }).addTo(map).bindPopup(B.mapFrom + ' ' + name).openPopup();
  map.setView([lat, lon], 14);
  drawRoute();
});

setupAutocomplete('destination', 'toSuggestions', (lat, lon, name) => {
  if (toMarker) map.removeLayer(toMarker);
  toMarker = L.marker([lat, lon], { icon: toIcon }).addTo(map).bindPopup(B.mapTo + ' ' + name).openPopup();
  drawRoute();
});

function drawRoute() {
  if (fromMarker && toMarker) {
    if (routeLine) map.removeLayer(routeLine);
    const from = fromMarker.getLatLng();
    const to = toMarker.getLatLng();
    routeLine = L.polyline([from, to], { color: '#06c167', weight: 3, dashArray: '8 6' }).addTo(map);
    map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
  }
}
</script>
<script>
// Poll ride status every 5 seconds
const bannerEl = document.getElementById('rideStatusBanner');
const B = {
  pendingTitle:     bannerEl.dataset.pendingTitle,
  pendingText:      bannerEl.dataset.pendingText,
  acceptedTitle:    bannerEl.dataset.acceptedTitle,
  acceptedText:     bannerEl.dataset.acceptedText,
  inprogressTitle:  bannerEl.dataset.inprogressTitle,
  inprogressText:   bannerEl.dataset.inprogressText,
  completedTitle:   bannerEl.dataset.completedTitle,
  completedText:    bannerEl.dataset.completedText,
  mapFrom:          bannerEl.dataset.mapFrom,
  mapTo:            bannerEl.dataset.mapTo
};

let lastStatus = 'NONE';
function pollRideStatus() {
  fetch('/client/ride-status')
    .then(r => r.json())
    .then(data => {
      const icon  = document.getElementById('rideStatusIcon');
      const title = document.getElementById('rideStatusTitle');
      const text  = document.getElementById('rideStatusText');
      if (data.status === 'ACCEPTED') {
        bannerEl.style.display = 'block';
        icon.textContent  = '🚗';
        title.textContent = B.acceptedTitle;
        text.textContent  = B.acceptedText.replace('{0}', data.driverUsername || '');
        bannerEl.style.borderColor = '#3b82f6';
      } else if (data.status === 'IN_PROGRESS') {
        bannerEl.style.display = 'block';
        icon.textContent  = '🧭';
        title.textContent = B.inprogressTitle;
        text.textContent  = B.inprogressText;
        bannerEl.style.borderColor = '#06c167';
      } else if (data.status === 'COMPLETED') {
        bannerEl.style.display = 'block';
        icon.textContent  = '✅';
        title.textContent = B.completedTitle;
        text.textContent  = B.completedText;
        bannerEl.style.borderColor = '#06c167';
      } else if (data.status === 'PENDING') {
        bannerEl.style.display = 'block';
        icon.textContent  = '⏳';
        title.textContent = B.pendingTitle;
        text.textContent  = B.pendingText;
        bannerEl.style.borderColor = '#f59e0b';
      }
      lastStatus = data.status;
    }).catch(() => {});
}
pollRideStatus();
setInterval(pollRideStatus, 5000);
</script>
</body>
</html>
