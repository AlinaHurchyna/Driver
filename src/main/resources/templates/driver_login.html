<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{login.title}">Войти</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div style="text-align:center;">
      <div style="font-size:5rem; margin-bottom:24px;">🚘</div>
      <h2 style="font-size:2rem; font-weight:800; margin-bottom:12px; color:var(--driver-accent);" th:text="#{nav.brand}">DRIVER</h2>
      <p style="color:var(--text-secondary); font-size:16px; line-height:1.7; max-width:320px;" th:text="#{register.driver.left.text}"></p>
    </div>
  </div>

  <div class="auth-right">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
      <div class="auth-logo" style="color:var(--driver-accent)" th:text="#{nav.brand}">DRIVER</div>
      <div class="lang-switcher">
        <a th:href="@{/driver/login(lang=ru)}" class="lang-btn" th:classappend="${#locale.language == 'ru'} ? 'active'">RU</a>
        <a th:href="@{/driver/login(lang=en)}" class="lang-btn" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
        <a th:href="@{/driver/login(lang=pl)}" class="lang-btn" th:classappend="${#locale.language == 'pl'} ? 'active'">PL</a>
        <a th:href="@{/driver/login(lang=be)}" class="lang-btn" th:classappend="${#locale.language == 'be'} ? 'active'">BY</a>
      </div>
    </div>

    <h1 class="auth-title" th:text="#{login.title}">Войти</h1>
    <p class="auth-subtitle" th:text="#{login.subtitle}"></p>

    <div th:if="${param.error}" class="alert alert-error" th:text="#{login.error}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label" th:text="#{register.label.email}">Email</label>
        <input class="form-input" type="text" name="username" th:placeholder="#{register.placeholder.email}" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label" th:text="#{login.label.password}">Пароль</label>
        <input class="form-input" type="password" name="password" th:placeholder="#{login.placeholder.password}" required/>
      </div>
      <button type="submit" class="btn btn-driver btn-full btn-lg" style="margin-top:8px;"
              th:text="#{login.btn}">Войти</button>
    </form>

    <div class="auth-footer" style="margin-top:20px;">
      <span th:text="#{register.have.account}">Нет аккаунта?</span>
      <a href="/driver/register" th:text="#{nav.become.driver}">Зарегистрироваться</a>
      &nbsp;·&nbsp;
      <a href="/home" th:text="#{login.home}">← На главную</a>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
