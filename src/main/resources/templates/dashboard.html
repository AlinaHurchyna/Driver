<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver — Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    #driverMap { height: 300px; border-radius: 12px; border: 1px solid var(--border); margin-top: 12px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.online  { background: #06c167; box-shadow: 0 0 0 3px rgba(6,193,103,0.25); }
    .status-dot.offline { background: #666; }
    .earnings-big { font-size: 2rem; font-weight: 800; color: var(--text-primary); }
    .quick-btn { display: flex; align-items: center; gap: 10px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 600; transition: background 0.2s; cursor: pointer; width: 100%; }
    .quick-btn:hover { background: var(--bg-card); border-color: var(--driver-accent); }
    .quick-btn .btn-icon { font-size: 22px; }
    #gps-status-driver { font-size: 12px; color: var(--text-secondary); margin-top: 6px; min-height: 16px; }
    .gps-dot { width: 16px; height: 16px; position: relative; }
    .gps-dot-inner { width: 16px; height: 16px; background: var(--driver-accent, #ff6b00); border-radius: 50%; border: 3px solid #fff; position: absolute; }
    .gps-dot-pulse { width: 40px; height: 40px; background: rgba(255,107,0,0.2); border-radius: 50%; position: absolute; top: -12px; left: -12px; animation: gpsPulse 2s ease-out infinite; }
    @keyframes gpsPulse { 0%{transform:scale(0.6);opacity:1} 100%{transform:scale(2);opacity:0} }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="/home" class="navbar-brand" style="color:var(--driver-accent)">DRIVER</a>
  <div class="navbar-links">
    <div class="lang-switcher">
      <a th:href="@{/api/drivers/dashboard(lang=ru)}" class="lang-btn" th:classappend="${#locale.language == 'ru'} ? 'active'">RU</a>
      <a th:href="@{/api/drivers/dashboard(lang=en)}" class="lang-btn" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
      <a th:href="@{/api/drivers/dashboard(lang=pl)}" class="lang-btn" th:classappend="${#locale.language == 'pl'} ? 'active'">PL</a>
      <a th:href="@{/api/drivers/dashboard(lang=be)}" class="lang-btn" th:classappend="${#locale.language == 'be'} ? 'active'">BY</a>
    </div>
    <span style="color:var(--text-secondary); font-size:14px;" th:if="${driver != null}">
      🚘 <span th:text="${driver.firstName + ' ' + driver.lastName}"></span>
    </span>
    <form th:action="@{/logout}" method="post" style="display:inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button type="submit" class="btn btn-secondary btn-sm" th:text="#{nav.logout}">Выйти</button></form>
  </div>
</nav>

<div class="dashboard">

  <!-- Greeting -->
  <div class="dashboard-header fade-up fade-up-1">
    <h1>
      <span th:text="#{dashboard.driver.greeting}">Привет,</span>
      <span th:if="${driver != null}" th:text="${driver.firstName}">Водитель</span> 🚘
    </h1>
    <p style="color:var(--text-secondary); margin-top:8px; font-size:16px;" th:text="#{dashboard.driver.subtitle}">Управляйте поездками</p>
  </div>

  <!-- Status card -->
  <div class="card fade-up fade-up-2" style="margin-bottom:16px;" th:if="${driver != null}">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;">
      <div>
        <div style="font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;" th:text="#{dashboard.driver.status}">Ваш статус</div>
        <div style="display:flex; align-items:center; font-size:15px; font-weight:700;">
          <span class="status-dot" th:classappend="${driver.available} ? 'online' : 'offline'"></span>
          <span th:if="${driver.available}"  style="color:#06c167;" th:text="#{dashboard.driver.online}">Онлайн</span>
          <span th:unless="${driver.available}" style="color:#888;" th:text="#{dashboard.driver.offline}">Офлайн</span>
        </div>
      </div>
      <a th:href="@{/api/drivers/availability/toggle}"
         class="btn"
         th:classappend="${driver.available} ? 'btn-secondary' : 'btn-success'"
         th:text="${driver.available} ? #{dashboard.driver.go.offline} : #{dashboard.driver.go.online}">
      </a>
    </div>
  </div>

  <!-- Map with GPS -->
  <div class="card fade-up fade-up-2" style="margin-bottom:16px;"
       th:attr="data-locating=#{dashboard.driver.gps.locating},data-active=#{dashboard.driver.gps.active},data-denied=#{dashboard.driver.gps.denied},data-unavailable=#{dashboard.driver.gps.unavailable},data-here=#{map.you.here},data-refresh=#{dashboard.driver.gps.refresh},data-location=#{dashboard.driver.location}">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <div style="font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em;" id="locationLabel">📡</div>
      <button id="locateDriverBtn" style="background:none;border:1px solid var(--border);color:var(--text-secondary);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;"></button>
    </div>
    <div id="driverMap"></div>
    <div id="gps-status-driver"></div>
  </div>

  <!-- Quick actions -->
  <div class="card fade-up fade-up-3" style="margin-bottom:16px;">
    <div style="font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:14px;" th:text="#{dashboard.driver.actions}">Действия</div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <a href="/api/drivers/available-rides" class="quick-btn">
        <span class="btn-icon">🗺️</span>
        <div>
          <div th:text="#{dashboard.driver.rides}">Доступные поездки</div>
          <div style="font-size:12px; color:var(--text-secondary); font-weight:400; margin-top:2px;" th:text="#{dashboard.driver.rides.sub}">Найти и принять заказ</div>
        </div>
        <span style="margin-left:auto; color:var(--text-secondary);">›</span>
      </a>
      <a href="/driver/ride-history" class="quick-btn">
        <span class="btn-icon">📋</span>
        <div>
          <div th:text="#{history.driver.title}">История поездок</div>
          <div style="font-size:12px; color:var(--text-secondary); font-weight:400; margin-top:2px;" th:text="#{history.driver.subtitle}">Все завершённые поездки</div>
        </div>
        <span style="margin-left:auto; color:var(--text-secondary);">›</span>
      </a>
    </div>
  </div>

  <!-- Stats -->
  <div class="dashboard-grid fade-up fade-up-4">
    <div class="stat-card">
      <div class="stat-icon stat-icon-green">💰</div>
      <div>
        <div class="stat-label" th:text="#{dashboard.driver.earnings}">Заработок</div>
        <div class="earnings-big">—</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon stat-icon-blue">⭐</div>
      <div>
        <div class="stat-label" th:text="#{dashboard.driver.rating}">Рейтинг</div>
        <div class="earnings-big" style="font-size:1.4rem;">5.0</div>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
const mapCard = document.querySelector('[data-locating]');
const T = {
  locating:    mapCard.dataset.locating,
  active:      mapCard.dataset.active,
  denied:      mapCard.dataset.denied,
  unavailable: mapCard.dataset.unavailable,
  here:        mapCard.dataset.here,
  refresh:     mapCard.dataset.refresh,
  location:    mapCard.dataset.location
};

document.getElementById('locationLabel').textContent = '📡 ' + T.location;
document.getElementById('locateDriverBtn').textContent = T.refresh;

const driverMap = L.map('driverMap').setView([52.2297, 21.0122], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(driverMap);

const driverIcon = L.divIcon({ className: '', iconSize:[16,16], iconAnchor:[8,8],
  html:'<div class="gps-dot"><div class="gps-dot-pulse"></div><div class="gps-dot-inner" style="background:var(--driver-accent,#ff6b00)"></div></div>'
});

let driverMarker = null, driverAccCircle = null;
const statusEl = document.getElementById('gps-status-driver');
statusEl.textContent = '📡 ' + T.locating;

function locateDriver(pan) {
  if (!navigator.geolocation) { statusEl.textContent = T.unavailable; return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
    if (driverMarker) { driverMap.removeLayer(driverMarker); driverMap.removeLayer(driverAccCircle); }
    driverAccCircle = L.circle([lat,lon],{radius:acc,color:'#ff6b00',fillColor:'#ff6b00',fillOpacity:0.08,weight:1}).addTo(driverMap);
    driverMarker = L.marker([lat,lon],{icon:driverIcon}).addTo(driverMap).bindPopup('🚘 ' + T.here).openPopup();
    if (pan) driverMap.setView([lat,lon], 15);
    statusEl.textContent = '📡 ' + T.active.replace('{acc}', Math.round(acc));
  }, () => {
    statusEl.textContent = '⚠️ ' + T.denied;
  }, { enableHighAccuracy: true, timeout: 10000 });
}

locateDriver(true);
navigator.geolocation && navigator.geolocation.watchPosition(pos => {
  const { latitude: lat, longitude: lon, accuracy: acc } = pos.coords;
  if (driverMarker) { driverMap.removeLayer(driverMarker); driverMap.removeLayer(driverAccCircle); }
  driverAccCircle = L.circle([lat,lon],{radius:acc,color:'#ff6b00',fillColor:'#ff6b00',fillOpacity:0.08,weight:1}).addTo(driverMap);
  driverMarker = L.marker([lat,lon],{icon:driverIcon}).addTo(driverMap);
  statusEl.textContent = '📡 ' + T.active.replace('{acc}', Math.round(acc));
}, null, {enableHighAccuracy:true});

document.getElementById('locateDriverBtn').addEventListener('click', () => locateDriver(true));
</script>
</body>
</html>
