<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{login.title}">Войти</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div style="text-align:center;">
      <div style="font-size:5rem; margin-bottom:24px;">🚗</div>
      <h2 style="font-size:2rem; font-weight:800; margin-bottom:12px;" th:text="#{nav.brand}">DRIVER</h2>
      <p style="color:var(--text-secondary); font-size:16px; line-height:1.7; max-width:320px;" th:text="#{hero.subtitle}"></p>
    </div>
  </div>

  <div class="auth-right">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px;">
      <div class="auth-logo" th:text="#{nav.brand}">DRIVER</div>
      <div class="lang-switcher">
        <a th:href="@{/login(lang=ru)}" class="lang-btn" th:classappend="${#locale.language == 'ru'} ? 'active'">RU</a>
        <a th:href="@{/login(lang=en)}" class="lang-btn" th:classappend="${#locale.language == 'en'} ? 'active'">EN</a>
        <a th:href="@{/login(lang=pl)}" class="lang-btn" th:classappend="${#locale.language == 'pl'} ? 'active'">PL</a>
        <a th:href="@{/login(lang=be)}" class="lang-btn" th:classappend="${#locale.language == 'be'} ? 'active'">BY</a>
      </div>
    </div>

    <h1 class="auth-title" th:text="#{login.title}">Войти</h1>
    <p class="auth-subtitle" th:text="#{login.subtitle}"></p>

    <div th:if="${param.error}" class="alert alert-error" th:text="#{login.error}"></div>
    <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="alert alert-info" style="margin-bottom:20px;" th:utext="#{login.hint}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label class="form-label" th:text="#{login.label.username}">Логин или Email</label>
        <input class="form-input" type="text" name="username" th:placeholder="#{login.placeholder.username}" required autofocus/>
      </div>
      <div class="form-group">
        <label class="form-label" th:text="#{login.label.password}">Пароль</label>
        <input class="form-input" type="password" name="password" th:placeholder="#{login.placeholder.password}" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:8px;"
              th:text="#{login.btn}" th:attr="data-loading=#{login.btn.loading}">Войти</button>
    </form>

    <div class="auth-divider" th:text="#{login.or}">или</div>

    <div style="display:flex; gap:10px;">
      <a href="/client/register" class="btn btn-secondary btn-full" th:text="#{login.register.client}">Регистрация клиента</a>
      <a href="/driver/register" class="btn btn-driver btn-full" th:text="#{login.register.driver}">Регистрация водителя</a>
    </div>

    <div class="auth-footer" style="margin-top:20px;">
      <a href="/home" th:text="#{login.home}">← На главную</a>
    </div>
  </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
